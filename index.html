<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Science Interactives Hub</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; margin: 0; background: #f4f7fb; color: #1f2937; }
    .wrap { max-width: 960px; margin: 0 auto; padding: 28px 20px 40px; }
    h1 { margin: 0 0 8px; font-size: 32px; }
    .sub { margin: 0 0 22px; color: #4b5563; }
    h2 { margin: 22px 0 10px; font-size: 20px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
    .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; padding: 14px; }
    .card h3 { margin: 0 0 6px; font-size: 17px; }
    .card p { margin: 0 0 10px; color: #6b7280; font-size: 14px; }
    .card a { color: #2563eb; text-decoration: none; font-weight: 600; }
    .nature { margin: 0 0 26px; }
    .nature h2 { margin-top: 0; }
    .nature figure { margin: 0; background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; overflow: hidden; }
    .nature-image { display: block; color: inherit; }
    .nature-image:focus-visible { outline: 3px solid #2563eb; outline-offset: 4px; }
    .nature img { display: block; width: 100%; height: auto; }
    .nature figcaption { padding: 12px 16px 14px; color: #4b5563; font-size: 14px; line-height: 1.7; }
    .nature figcaption p { margin: 0 0 5px; }
    .nature figcaption a { color: #2563eb; font-weight: 600; }
    @media (max-width: 540px) { .wrap { padding: 22px 14px 32px; } h1 { font-size: 27px; } }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Science Interactives Hub</h1>
    <p class="sub">明湾学校互动资源入口（Teaching + Other Projects）</p>

    <section class="nature" aria-labelledby="nature-title">
      <h2 id="nature-title">身边的自然 · Nature Around Us</h2>
      <figure>
        <a class="nature-image" href="./assets/nature-around-us.webp" target="_blank" rel="noopener" aria-label="查看身边的自然高清大图（新窗口）">
          <img src="./assets/nature-around-us.webp" width="1834" height="1008" fetchpriority="high" alt="八种生物的摄影拼图：秋茄、弹涂鱼、招潮蟹、牡蛎、黑鸢、黑翅长脚鹬、蚯蚓和东方蜜蜂；每种生物配有中文名称。" />
        </a>
        <figcaption>
          <p>从植物到鸟类，观察这些生物的外形与生活环境。你认识其中的几种？</p>
          <a href="./assets/nature-around-us.webp" target="_blank" rel="noopener">查看大图 · View full image ↗</a>
        </figcaption>
      </figure>
    </section>

    <h2>Other Projects</h2>
    <div class="grid">
      <div class="card">
        <h3>Sports Day Ranking</h3>
        <p>运动会径赛录入与自动排名系统</p>
        <a href="./sports-day-ranking/">打开项目</a>
      </div>
    </div>

<h2>Teaching</h2>
<div class="grid">
  <div class="card">
    <h3>Teaching Portal</h3>
    <p>按年级进入教学互动资源（G3 / G4 / G5）</p>
    <a href="./teaching/">进入 Teaching</a>
  </div>
</div>
  </div>
</body>
</html>
